spring:
  application:
    name: codecrusader-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    # HS256 key, base64-encoded. Override via JWT_SECRET in every real
    # environment — this default exists only so `mvn spring-boot:run` works
    # out of the box in dev.
    secret: ${JWT_SECRET:ZGV2LWNvZGVjcnVzYWRlci1kZWZhdWx0LWp3dC1zaWduaW5nLWtleS1jaGFuZ2UtbWU=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
